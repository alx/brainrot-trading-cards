<html lang="en">
<head>

<meta property="og:type"        content="website" />
<meta property="og:site_name"   content="Brainrot Trading Cards" />

<meta property="og:title"       id="og-title"     content="Brainrot Trading Cards — Make a Trade!" />
<meta property="og:description" id="og-desc"      content="Build your trade offer with brainrot characters and share it with friends. Pick your cards, set your terms, and trade!" />
<meta property="og:image"       id="og-image"
  content="https://brainrot-og.girard-davila.net/render?u=https%3A%2F%2Fbrainrot.girard-davila.net%2F" />
<meta property="og:image:type"   content="image/png" />

<meta name="twitter:description" id="tw-desc"     content="Build your trade offer with brainrot characters and share it with friends. Pick your cards, set your terms, and trade!" />

  content="https://brainrot-og.girard-davila.net/render?u=https%3A%2F%2Fbrainrot.girard-davila.net%2F" />
<meta name="twitter:image:alt"  id="tw-image-alt" content="A brainrot trading card" />
<script>
(function(){
  var img = 'https://brainrot-og.girard-davila.net/render?u=' + encodeURIComponent(location.href);
  function set(id, val) { var el = document.getElementById(id); if (el) el.setAttribute('content', val); }
  set('og-url',   location.href);
  set('og-image', img);
  set('tw-image', img);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- Brainrots are loaded from static/brainrots.json -->

<link rel="stylesheet" href="static/css/style.css" />


</head>
<body>
<div class="page-col">

<header class="editor-header">
  <h2>BRAINROT TRADING CARD</h2>
  <div class="editor-top">
    <div class="fair-exchange" id="fair-exchange">
      <span class="fe-val fe-left-val" id="fe-left-val">—</span>
      <i class="fa fa-balance-scale fe-icon" id="fe-icon"></i>
      <span class="fe-val fe-right-val" id="fe-right-val">—</span>
    </div>

    <div class="field">
      <label>Card background</label>
      <div class="swatches" data-bg-target="bg">
        <div class="swatch" data-bg="orange" style="background: radial-gradient(ellipse at center, #ffc049, #d96a0c);"></div>
        <div class="swatch" data-bg="blue" style="background: radial-gradient(ellipse at center, #6fd9ff, #14538c);"></div>
        <div class="swatch" data-bg="pink" style="background: radial-gradient(ellipse at center, #ff9ad6, #c0166e);"></div>
        <div class="swatch" data-bg="purple" style="background: radial-gradient(ellipse at center, #c89aff, #4d1b89);"></div>
        <div class="swatch" data-bg="green" style="background: radial-gradient(ellipse at center, #b9f068, #2d6e0a);"></div>
        <div class="swatch" data-bg="red" style="background: radial-gradient(ellipse at center, #ff8a6a, #8c1308);"></div>
      </div>
    </div>

    <div class="field field-grow" hidden>
      <label>Current share URL</label>
      <div class="share-box" id="share-url"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-icon" id="btn-share" title="Copy share link" aria-label="Copy share link">
        <i class="fa fa-share-alt"></i>
      </button>
      <button class="btn secondary btn-icon" id="btn-download" title="Download PNG" aria-label="Download PNG">
        <i class="fa fa-image"></i>
      </button>
    </div>
  </div>
</header>

<div class="stage" id="stage">
  <div id="card-wrap"></div>
</div>

<aside class="editor" id="editor">
  <div class="editor-sides">

    <section class="side-edit">
      <header class="side-edit-head" style="color:#ffd83a">◀ OFFERING (LEFT)</header>

      <div class="side-edit-sub">


        <div class="field">

          <div class="ac-wrap" id="ac-left"></div>
        </div>

        <div class="field">
          <label>Mutation</label>
          <div id="f-lm"></div>
        </div>

        <div class="field">
          <label>Traits</label>
          <div class="trait-picker-row">
            <div id="f-lt-pick"></div>
            <button class="btn-add-trait" id="btn-lt-add" type="button">+</button>
          </div>
          <div class="trait-list" id="tl-left"></div>
        </div>
      </div>

      <div class="side-edit-sub collapsed">
        <div class="side-edit-sub-head">VISUAL</div>

        <div class="field">
          <label>Name color</label>
          <select id="f-lc">
            <option value="gold">Gold</option>
            <option value="white">White</option>
            <option value="rainbow">Rainbow</option>
            <option value="cyan">Cyan</option>
            <option value="green">Green</option>
            <option value="pink">Pink</option>
          </select>
        </div>

        <div class="field">
          <label>Frame background</label>
          <div class="swatches" data-bg-target="lbg">
            <div class="swatch" data-bg="orange" style="background: radial-gradient(ellipse at center, #ffe089, #ff9b1c);"></div>
            <div class="swatch" data-bg="blue" style="background: radial-gradient(ellipse at center, #7adfff, #1f6db8);"></div>
            <div class="swatch" data-bg="pink" style="background: radial-gradient(ellipse at center, #ffaadc, #c91a82);"></div>
            <div class="swatch" data-bg="purple" style="background: radial-gradient(ellipse at center, #d774ff, #6a14b3);"></div>
            <div class="swatch" data-bg="green" style="background: radial-gradient(ellipse at center, #b9f068, #2d6e0a);"></div>
            <div class="swatch" data-bg="red" style="background: radial-gradient(ellipse at center, #ff8a6a, #8c1308);"></div>
            <div class="swatch" data-bg="dark" style="background: radial-gradient(ellipse at center, #555, #111);"></div>
          </div>
        </div>

        <div class="field">
          <label>Subtitle (optional)</label>
          <textarea id="f-ls" rows="2" placeholder="e.g. {gold:OG} ONLY"></textarea>
        </div>
      </div>
    </section>

    <section class="side-edit">
      <header class="side-edit-head" style="color:#ff5aca">WANTING (RIGHT) ▶</header>

      <div class="side-edit-sub">


        <div class="field">

          <div class="ac-wrap" id="ac-right"></div>
        </div>

        <div class="field">
          <label>Mutation</label>
          <div id="f-rm"></div>
        </div>

        <div class="field">
          <label>Traits</label>
          <div class="trait-picker-row">
            <div id="f-rt-pick"></div>
            <button class="btn-add-trait" id="btn-rt-add" type="button">+</button>
          </div>
          <div class="trait-list" id="tl-right"></div>
        </div>
      </div>

      <div class="side-edit-sub collapsed">
        <div class="side-edit-sub-head">VISUAL</div>

        <div class="field">
          <label>Name color</label>
          <select id="f-rc">
            <option value="rainbow">Rainbow</option>
            <option value="gold">Gold</option>
            <option value="white">White</option>
            <option value="cyan">Cyan</option>
            <option value="green">Green</option>
            <option value="pink">Pink</option>
          </select>
        </div>

        <div class="field">
          <label>Frame background</label>
          <div class="swatches" data-bg-target="rbg">
            <div class="swatch" data-bg="orange" style="background: radial-gradient(ellipse at center, #ffe089, #ff9b1c);"></div>
            <div class="swatch" data-bg="blue" style="background: radial-gradient(ellipse at center, #7adfff, #1f6db8);"></div>
            <div class="swatch" data-bg="pink" style="background: radial-gradient(ellipse at center, #ffaadc, #c91a82);"></div>
            <div class="swatch" data-bg="purple" style="background: radial-gradient(ellipse at center, #d774ff, #6a14b3);"></div>
            <div class="swatch" data-bg="green" style="background: radial-gradient(ellipse at center, #b9f068, #2d6e0a);"></div>
            <div class="swatch" data-bg="red" style="background: radial-gradient(ellipse at center, #ff8a6a, #8c1308);"></div>
            <div class="swatch" data-bg="dark" style="background: radial-gradient(ellipse at center, #555, #111);"></div>
          </div>
        </div>

        <div class="field">
          <label>Subtitle</label>
          <textarea id="f-rs" rows="3"></textarea>
        </div>
      </div>
    </section>

  </div>
</aside>

<div class="toast" id="toast">Copied!</div>

<script src="static/js/app.js"></script>

</div><!-- /.page-col -->
</body>
</html>
